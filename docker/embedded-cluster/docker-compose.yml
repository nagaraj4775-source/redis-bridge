version: "3.9"

# ─────────────────────────────────────────────────────────────
# Embedded-cluster mode — 3 sites × 3 masters, NO bus container.
# Each site's master1 doubles as the replication bus.
# Identical topology to docker/cluster/ except redis-bus is removed
# and agents use bus.mode: embedded.
#
# Port layout (distinct from all other compose files):
#   redis-a master1/2/3 : 6411 / 6412 / 6413
#   redis-b master1/2/3 : 6414 / 6415 / 6416
#   redis-c master1/2/3 : 6417 / 6418 / 6419
#   agent-a coordinator : 8291   metrics: 9291
#   agent-b coordinator : 8292   metrics: 9292
#   agent-c coordinator : 8293   metrics: 9293
#
# Usage:
#   docker compose -f docker/embedded-cluster/docker-compose.yml up --build -d
# ─────────────────────────────────────────────────────────────

services:
  # ─── Site A Masters ───
  redis-a-master1:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events KEA --save "" --appendonly no
    ports: ["6411:6379"]
    networks: [replnet]

  redis-a-master2:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events KEA --save "" --appendonly no
    ports: ["6412:6379"]
    networks: [replnet]

  redis-a-master3:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events KEA --save "" --appendonly no
    ports: ["6413:6379"]
    networks: [replnet]

  # ─── Site B Masters ───
  redis-b-master1:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events KEA --save "" --appendonly no
    ports: ["6414:6379"]
    networks: [replnet]

  redis-b-master2:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events KEA --save "" --appendonly no
    ports: ["6415:6379"]
    networks: [replnet]

  redis-b-master3:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events KEA --save "" --appendonly no
    ports: ["6416:6379"]
    networks: [replnet]

  # ─── Site C Masters ───
  redis-c-master1:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events KEA --save "" --appendonly no
    ports: ["6417:6379"]
    networks: [replnet]

  redis-c-master2:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events KEA --save "" --appendonly no
    ports: ["6418:6379"]
    networks: [replnet]

  redis-c-master3:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events KEA --save "" --appendonly no
    ports: ["6419:6379"]
    networks: [replnet]

  # ─── Agent A (no bus dependency — embedded on redis-a-master1) ───
  agent-a:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["--config", "/etc/redibridge/agent.yaml"]
    volumes:
      - ../../config/embedded-cluster/agent-a.yaml:/etc/redibridge/agent.yaml:ro
    ports: ["8291:8080", "9291:9090"]
    depends_on: [redis-a-master1, redis-a-master2, redis-a-master3]
    networks: [replnet]
    restart: unless-stopped

  # ─── Agent B ───
  agent-b:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["--config", "/etc/redibridge/agent.yaml"]
    volumes:
      - ../../config/embedded-cluster/agent-b.yaml:/etc/redibridge/agent.yaml:ro
    ports: ["8292:8080", "9292:9090"]
    depends_on: [redis-b-master1, redis-b-master2, redis-b-master3]
    networks: [replnet]
    restart: unless-stopped

  # ─── Agent C ───
  agent-c:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["--config", "/etc/redibridge/agent.yaml"]
    volumes:
      - ../../config/embedded-cluster/agent-c.yaml:/etc/redibridge/agent.yaml:ro
    ports: ["8293:8080", "9293:9090"]
    depends_on: [redis-c-master1, redis-c-master2, redis-c-master3]
    networks: [replnet]
    restart: unless-stopped

networks:
  replnet:
    driver: bridge
