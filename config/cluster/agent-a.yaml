# ══════════════════════════════════════════════════════════════════════════════
# CLUSTER — Redis Cluster (sharded, multi-master) per site  +  dedicated bus Redis
# ══════════════════════════════════════════════════════════════════════════════
# Use when:
#   • Each site runs a Redis Cluster with multiple masters (data is sharded)
#   • You are willing to run a separate "bus" Redis shared by all agents
#
# Docker Compose : docker/cluster/docker-compose.yml
# Make target    : make up-cluster
# Redis per site : 3 masters per site (redis-{a,b,c}-master{1,2,3})
# Bus            : redis-bus (one shared standalone instance)
# Ports          : Redis 6381-6389 | Bus 6390 | API 8081-8083 | Metrics 9091-9093
# ══════════════════════════════════════════════════════════════════════════════

site_id: "cluster-a"

cluster:
  mode: "cluster"
  masters:
    - "redis-a-master1:6379"
    - "redis-a-master2:6379"
    - "redis-a-master3:6379"
  password: ""
  tls: false

bus:
  # --- Option 1: dedicated bus Redis instance (default) ---
  mode: "standalone"
  addr: "redis-bus:6379"

  # --- Option 2: reuse one of this site's own masters as the bus ---
  # mode: "embedded"
  # master_index: 0          # 0 = redis-a-master1, 1 = master2, 2 = master3

  # --- Option 3: HA bus via Redis Sentinel ---
  # mode: "sentinel"
  # sentinel_master: "bus-master"
  # sentinel_addrs: ["sentinel1:26379", "sentinel2:26379", "sentinel3:26379"]

  stream_prefix: "repl:stream:"
  consumer_group: "repl-consumers"
  password: ""

peers:
  - "cluster-b"
  - "cluster-c"

replication:
  batch_size: 100
  apply_concurrency: 8
  dedup_ttl_seconds: 5
  max_in_flight: 1000

coordinator:
  port: 8080

metrics:
  port: 9090
