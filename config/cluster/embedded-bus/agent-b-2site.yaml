site_id: "ec-site-b"
role: "full"
consumer_id: ""

cluster:
  mode: "cluster"
  masters:
    - "redis-b-master1:6379"
    - "redis-b-master2:6379"
    - "redis-b-master3:6379"
  password: ""
  tls: false

bus:
  mode: "embedded"
  master_index: 0
  peer_bus_addrs:
    ec-site-a: "redis-a-master1:6379"
  stream_prefix: "repl:stream:"
  consumer_group: "repl-consumers"
  stream_max_len: 2000000
  stream_ttl_hours: 0
  password: ""

peers:
  - "ec-site-a"

replication:
  batch_size: 100
  apply_concurrency: 8
  dedup_ttl_seconds: 5
  max_in_flight: 1000
  reconcile_interval_seconds: 30  # How often (seconds) the reconciler scans for PubSub-missed keys; 0 = disabled

coordinator:
  port: 8080

metrics:
  port: 9090
