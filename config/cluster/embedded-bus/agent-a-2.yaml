# ─ Secondary full agent for site-a (HA ring) ─────────────────────────────────
# Runs alongside agent-a on the same site. Both are full mode (producer+consumer).
#
# Producer side: pub_dedup:true ensures only ONE of the two agents publishes
#   each keyspace event. The other skips silently via the __pub: SETNX race.
#
# Consumer side: both agents share the same consumer group "repl-consumers".
#   Redis Streams naturally load-balances — each message is delivered to
#   exactly one consumer in the group, so messages are not double-applied.
#
# Reconciler: disabled here — agent-a (primary) owns reconciliation.
#   If agent-a is permanently down, bump reconcile_interval_seconds here.
# ─────────────────────────────────────────────────────────────────────────────

site_id: "ec-site-a"
role: "full"
consumer_id: "agent-a-2"    # stable name — survives container restarts; no stale XINFO entries

cluster:
  mode: "cluster"
  masters:
    - "redis-a-master1:6379"
    - "redis-a-master2:6379"
    - "redis-a-master3:6379"
  password: ""
  tls: false

bus:
  mode: "embedded"
  master_index: 0
  peer_bus_addrs:
    ec-site-b: "redis-b-master1:6379"
    ec-site-c: "redis-c-master1:6379"
  stream_prefix: "repl:stream:"
  consumer_group: "repl-consumers"
  stream_max_len: 1000000
  stream_ttl_hours: 0
  password: ""

peers:
  - "ec-site-b"
  - "ec-site-c"

replication:
  batch_size: 100
  apply_concurrency: 8
  dedup_ttl_seconds: 5
  max_in_flight: 1000
  reconcile_interval_seconds: 0    # disabled — agent-a (primary) owns reconciliation
  reconcile_startup_delay_seconds: 0
  pub_dedup: true                  # races with agent-a; exactly one publishes per event
  reconcile_scan_batch_size: 500
  auto_bootstrap_threshold: 0

coordinator:
  port: 8080

metrics:
  port: 9090
