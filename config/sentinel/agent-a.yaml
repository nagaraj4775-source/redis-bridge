# ══════════════════════════════════════════════════════════════════════════════
# SENTINEL — Redis Sentinel HA per site  +  dedicated Sentinel bus
# ══════════════════════════════════════════════════════════════════════════════
# Use when:
#   • Each site needs automatic master failover (1 master + replicas + sentinels)
#   • You want the replication bus to also be HA (backed by its own Sentinel set)
#
# Docker Compose : docker/sentinel/docker-compose.yml
# Make target    : make up-sentinel
# Redis per site : 1 master + 2 replicas + 3 sentinels per site
# Bus            : dedicated Redis Sentinel cluster (bus-master + bus-sentinels)
# Ports          : Masters 6381-6383 | Bus 6390 | API 8081-8083 | Metrics 9091-9093
# ══════════════════════════════════════════════════════════════════════════════

site_id: "cluster-a"

cluster:
  mode: "sentinel"
  sentinel_master: "mymaster-a"
  sentinel_addrs:
    - "sentinel-a-1:26379"
    - "sentinel-a-2:26379"
    - "sentinel-a-3:26379"
  password: ""
  tls: false

bus:
  mode: "sentinel"
  sentinel_master: "bus-master"
  sentinel_addrs:
    - "bus-sentinel-1:26379"
    - "bus-sentinel-2:26379"
    - "bus-sentinel-3:26379"
  stream_prefix: "repl:stream:"
  consumer_group: "repl-consumers"
  password: ""

peers:
  - "cluster-b"
  - "cluster-c"

replication:
  batch_size: 100
  apply_concurrency: 8
  dedup_ttl_seconds: 5
  max_in_flight: 1000

coordinator:
  port: 8080

metrics:
  port: 9090
