site_id: "cluster-a"

cluster:
  mode: "standalone"
  addr: "redis-a:6379"
  password: ""
  tls: false

bus:
  mode: "standalone"
  addr: "redis-bus:6379"
  stream_prefix: "repl:stream:"
  consumer_group: "repl-consumers"
  password: ""

peers:
  - "cluster-b"
  - "cluster-c"

replication:
  batch_size: 100
  apply_concurrency: 8
  dedup_ttl_seconds: 5
  max_in_flight: 1000

coordinator:
  port: 8080

metrics:
  port: 9090
