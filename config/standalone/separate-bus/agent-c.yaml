# ─ Site identity ────────────────────────────────────────────────────────────
site_id: "site-c"           # Unique name for this site — used in stream names and LWW resolution
role: "full"          # "full" (producer+consumer) | "consumer" (scale-out apply) | "producer" (publish only)
consumer_id: ""       # unique XREADGROUP consumer name; leave empty to use hostname automatically

# ─ Local Redis connection ────────────────────────────────────────────────────
cluster:
  mode: "standalone"        # standalone | sentinel | cluster
  addr: "redis-c:6379"      # Redis address (standalone mode only)
  password: ""              # Redis AUTH password ("" = no auth)
  tls: false                # Set true to enable TLS for the Redis connection

# ─ Replication bus ───────────────────────────────────────────────────────────
bus:
  mode: "standalone"        # standalone = dedicated shared bus Redis instance
  addr: "redis-bus:6379"    # Address of the shared bus Redis
  stream_prefix: "repl:stream:"      # Key prefix for all replication streams (stream = prefix + site_id)
  consumer_group: "repl-consumers"   # Consumer group name (scoped per site internally)
  stream_max_len: 1000000   # Max entries retained per stream; oldest trimmed on each write (0 = unlimited)
  stream_ttl_hours: 0   # Time-based retention: trim entries older than N hours (0 = disabled; takes priority over stream_max_len when set)
  password: ""              # Bus Redis AUTH password ("" = no auth)

# ─ Peer sites to replicate from ─────────────────────────────────────────────
peers:
  - "site-a"                # Must match the site_id of the peer's agent config
  - "site-b"

# ─ Replication tuning ────────────────────────────────────────────────────────
replication:
  batch_size: 100           # Messages fetched per XREADGROUP call per peer
  apply_concurrency: 8      # Parallel goroutines applying messages from a single peer stream
  dedup_ttl_seconds: 5      # Shadow key TTL (seconds) used to suppress replication loops
  max_in_flight: 1000       # Max unacknowledged messages before the consumer pauses (backpressure)
  reconcile_interval_seconds: 30  # How often (seconds) the reconciler scans for PubSub-missed keys; 0 = disabled
  reconcile_startup_delay_seconds: 60   # hold off first reconcile after restart so consumer can drain PEL from peers (0 = no delay)
  pub_dedup: false          # enable per-event publish dedup for HA multi-producer mode (set true on ALL producers in a site when running 3+)
  reconcile_scan_batch_size: 500    # keys per SCAN cursor hop and HMGET pipeline batch during reconciler scan (default 500; increase for large clusters)
  auto_bootstrap_threshold: 0      # if missing-meta keys exceed this during reconcile, auto-trigger bootstrap instead (0 = disabled)
  # Pattern filtering (Feature 5): replicate only matching keys.
  # include_patterns:    # if set, only keys matching at least one pattern are replicated
  #   - "users:*"
  #   - "orders:*"
  # exclude_patterns:    # keys matching any pattern are never replicated
  #   - "cache:*"
  #   - "tmp:*"

# ─ HTTP coordinator API ──────────────────────────────────────────────────────
coordinator:
  port: 8080                # Serves: GET /lag  GET /pause  GET /resume  GET /status

# ─ Prometheus metrics ────────────────────────────────────────────────────────
metrics:
  port: 9090                # Prometheus scrape endpoint at http://host:9090/metrics
