# ══════════════════════════════════════════════════════════════════════════════
# EMBEDDED BUS + CLUSTER — Redis Cluster per site,  NO dedicated bus container
# ══════════════════════════════════════════════════════════════════════════════
# Use when:
#   • Each site runs a Redis Cluster (multiple masters, data is sharded)
#   • You do NOT want to run a separate bus Redis
#   • master1 of each site hosts the replication stream (repl:stream:ec-site-a)
#   • Agents pull peer streams directly from each peer's master1
#
# Docker Compose : docker/embedded-cluster/docker-compose.yml
# Make target    : make up-embedded-cluster
# Redis per site : 3 masters per site — master1 also hosts the stream
# Bus            : NONE — stream embedded on master1 of each site
# Ports          : Redis 6411-6419 | API 8291-8293 | Metrics 9291-9293
# ══════════════════════════════════════════════════════════════════════════════

site_id: "ec-site-a"

cluster:
  mode: "cluster"
  masters:
    - "redis-a-master1:6379"
    - "redis-a-master2:6379"
    - "redis-a-master3:6379"
  password: ""
  tls: false

bus:
  mode: "embedded"          # stream lives on redis-a-master1 (master_index: 0)
  master_index: 0
  peer_bus_addrs:           # reach each peer's stream on their master1
    ec-site-b: "redis-b-master1:6379"
    ec-site-c: "redis-c-master1:6379"
  stream_prefix: "repl:stream:"
  consumer_group: "repl-consumers"
  password: ""

peers:
  - "ec-site-b"
  - "ec-site-c"

replication:
  batch_size: 100
  apply_concurrency: 8
  dedup_ttl_seconds: 5
  max_in_flight: 1000

coordinator:
  port: 8080

metrics:
  port: 9090
