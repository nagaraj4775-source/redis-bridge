site_id: "ec-site-a"

cluster:
  mode: "cluster"
  masters:
    - "redis-a-master1:6379"
    - "redis-a-master2:6379"
    - "redis-a-master3:6379"
  password: ""
  tls: false

bus:
  mode: "embedded"          # stream lives on redis-a-master1 (master_index: 0)
  master_index: 0
  peer_bus_addrs:           # reach each peer's stream on their master1
    ec-site-b: "redis-b-master1:6379"
    ec-site-c: "redis-c-master1:6379"
  stream_prefix: "repl:stream:"
  consumer_group: "repl-consumers"
  password: ""

peers:
  - "ec-site-b"
  - "ec-site-c"

replication:
  batch_size: 100
  apply_concurrency: 8
  dedup_ttl_seconds: 5
  max_in_flight: 1000

coordinator:
  port: 8080

metrics:
  port: 9090
