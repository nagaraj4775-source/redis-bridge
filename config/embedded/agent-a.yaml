# ══════════════════════════════════════════════════════════════════════════════
# EMBEDDED BUS — 1 Redis instance per site,  NO dedicated bus container
# ══════════════════════════════════════════════════════════════════════════════
# Use when:
#   • Each site has exactly ONE Redis instance
#   • You do NOT want to run a separate bus Redis
#   • Each site's own Redis hosts its replication stream (repl:stream:site-a)
#   • Agents pull peer streams directly from each peer's Redis
#
# Docker Compose : docker/embedded/docker-compose.yml
# Make target    : make up-embedded
# Redis per site : redis-a / redis-b / redis-c  (data + stream on same instance)
# Bus            : NONE — stream is embedded in each site's Redis
# Ports          : Redis 6401-6403 | API 8191-8193 | Metrics 9191-9193
# ══════════════════════════════════════════════════════════════════════════════

site_id: "site-a"

cluster:
  mode: "standalone"
  addr: "redis-a:6379"
  password: ""
  tls: false

bus:
  mode: "embedded"        # reuse redis-a as the bus — no separate bus container
  master_index: 0         # standalone mode always uses index 0
  peer_bus_addrs:         # where to find each peer's replication stream
    site-b: "redis-b:6379"
    site-c: "redis-c:6379"
  stream_prefix: "repl:stream:"
  consumer_group: "repl-consumers"
  password: ""

peers:
  - "site-b"
  - "site-c"

replication:
  batch_size: 100
  apply_concurrency: 8
  dedup_ttl_seconds: 5
  max_in_flight: 1000

coordinator:
  port: 8080

metrics:
  port: 9090
